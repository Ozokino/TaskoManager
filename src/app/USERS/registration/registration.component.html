<h2>Registration</h2>
<form [formGroup]="registrationForm" (ngSubmit)="register()">
  <div>
    <label for="firstName"><strong> First name:</strong></label>
    <input id="firstName" formControlName="firstName" type="text" required />
    <div *ngIf="registrationForm.get('firstName')?.invalid && registrationForm.get('firstName')?.touched">
      <small *ngIf="registrationForm.get('firstName')?.errors?.['required']">First Name is required.</small>
    </div>
  </div>

  <div>
    <label for="lastName"><strong>Last name:</strong></label>
    <input id="lastName" formControlName="lastName" type="text" required />
    <div *ngIf="registrationForm.get('lastName')?.invalid && registrationForm.get('lastName')?.touched">
      <small *ngIf="registrationForm.get('lastName')?.errors?.['required']">Last Name is required.</small>
    </div>
  </div>

  <div>
    <label for="username"><strong>Username:</strong></label>
    <input id="username" formControlName="username" type="text" required />
    <div *ngIf="registrationForm.get('username')?.invalid && registrationForm.get('username')?.touched">
      <small *ngIf="registrationForm.get('username')?.errors?.['minlength']">Username must be at least 3 characters.</small>
    </div>
  </div>

  <div>
    <label for="password"><strong>Password:</strong></label>
    <input id="password" formControlName="password" type="password" required />
    <div *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched">
      <small *ngIf="registrationForm.get('password')?.errors?.['minlength']">Password must be at least 5 characters.</small>
    </div>
  </div>

  <button type="submit" class="btn btn-info"[disabled]="registrationForm.invalid">Register</button>
</form>
